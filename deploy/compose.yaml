services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: taskharbor
      POSTGRES_USER: taskharbor
      POSTGRES_PASSWORD: taskharbor_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskharbor -d taskharbor"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
