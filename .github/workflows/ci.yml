name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: taskharbor_test
          POSTGRES_USER: taskharbor
          POSTGRES_PASSWORD: taskharbor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskharbor -d taskharbor_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://taskharbor:taskharbor_test@127.0.0.1:5432/taskharbor_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.95.0 fmt --all -- --check

      - name: Run Clippy
        run: cargo +1.95.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Run unit tests
        run: cargo +1.95.0 test --workspace --locked --lib

      - name: Run adapter integration tests
        run: cargo +1.95.0 test -p taskharbor-adapters --locked -- --ignored --test-threads=1

      - name: Run API integration tests
        run: cargo +1.95.0 test -p taskharbor-api --tests --locked -- --ignored --test-threads=1

      - name: Run worker integration tests
        run: cargo +1.95.0 test -p taskharbor-worker --tests --locked -- --ignored --test-threads=1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust, frontend]
    env:
      TASKHARBOR_OWNER_PASSWORD: compose-smoke-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yaml config --quiet

      - name: Build and exercise the complete stack
        run: bash scripts/compose-smoke.sh
